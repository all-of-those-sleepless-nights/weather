<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search any city for today's weather, with a history of your recent searches."
    />
    <title>Today's Weather</title>
    <script>
      // Applies the saved theme before first paint, so the page never flashes
      // the wrong one. Mirrors the logic in theme-provider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("todays-weather.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
